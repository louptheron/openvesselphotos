services:
  db:
    image: postgres:17-alpine
    container_name: openvesselphotos_database
    environment:
      - POSTGRES_USER=ovp
      - POSTGRES_PASSWORD=ovp
      - POSTGRES_DB=ovp
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 5433, so that it runs alongside MonitorFish's database (5432)
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovp -d ovp"]
      interval: 1s
      timeout: 1s
      retries: 30

  app:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
    container_name: openvesselphotos_app
    environment:
      - OPENVESSELPHOTOS_DATABASE_URL=postgresql://ovp:ovp@db:5432/ovp
      - OPENVESSELPHOTOS_ADMIN_PASSWORD=${OPENVESSELPHOTOS_ADMIN_PASSWORD:-admin}
    ports:
      - 8880:8880
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - app

volumes:
  db-data:
