version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "louptheron"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[Tech] "
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # The Gradle wrapper and settings are at the root (Scalingo needs them there)
  - package-ecosystem: "gradle"
    directory: "/"
    cooldown:
      default-days: 30
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    assignees:
      - "louptheron"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[Tech] Backend - "
    labels: ["dependencies"]
    groups:
      non-major-dependencies:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    cooldown:
      default-days: 30
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    assignees:
      - "louptheron"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[Tech] Frontend - "
    labels: ["dependencies"]
    groups:
      non-major-dependencies:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/infra/docker/app"
    assignees:
      - "louptheron"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[Tech] Docker - "
    labels: ["dependencies"]
