server:
    # PORT is set by Scalingo
    port: ${PORT:${OPENVESSELPHOTOS_SERVER_PORT:8880}}
    tomcat:
        threads:
            # Few threads: an S container (256 MB) allows 128 processes and threads in all
            max: ${OPENVESSELPHOTOS_SERVER_MAX_THREADS:20}
            min-spare: 2
    forward-headers-strategy: framework
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
        min-response-size: 2048

openvesselphotos:
    # Canonical base URL (e.g. https://openvesselphotos.org) in canonical links and the sitemap. Empty = requested host.
    public-url: ${OPENVESSELPHOTOS_PUBLIC_URL:}
    # Header holding the client IP, set by the proxy in front of the app (X-Real-IP on Scalingo).
    # Empty = the TCP address. Never set it without such a proxy: clients could then choose their IP.
    client-ip-header: ${OPENVESSELPHOTOS_CLIENT_IP_HEADER:}
    # Behind Cloudflare's proxy: the client IP is then CF-Connecting-IP, on requests coming from Cloudflare only.
    behind-cloudflare: ${OPENVESSELPHOTOS_BEHIND_CLOUDFLARE:false}
    rate-limits:
        # GET /v1/**, per IP
        reads-per-minute: ${OPENVESSELPHOTOS_RATE_LIMIT_READS_PER_MINUTE:600}
        # POST /v1/** without API key (the website's forms), per IP
        writes-per-hour: ${OPENVESSELPHOTOS_RATE_LIMIT_WRITES_PER_HOUR:20}
        # POST /v1/** with an API key, per key
        api-key-writes-per-hour: ${OPENVESSELPHOTOS_RATE_LIMIT_API_KEY_WRITES_PER_HOUR:1000}
        # POST /v1/api-key-requests, per IP
        api-key-requests-per-hour: ${OPENVESSELPHOTOS_RATE_LIMIT_API_KEY_REQUESTS_PER_HOUR:5}
    # Unique admin password. Empty = admin disabled.
    admin-password: ${OPENVESSELPHOTOS_ADMIN_PASSWORD:}
    database:
        # Scalingo sets SCALINGO_POSTGRESQL_URL and its alias DATABASE_URL (postgresql://user:password@host:port/db?sslmode=prefer).
        # A jdbc: URL is accepted too.
        url: ${SCALINGO_POSTGRESQL_URL:${DATABASE_URL:${OPENVESSELPHOTOS_DATABASE_URL}}}
        hikari-max-pool-size: ${OPENVESSELPHOTOS_DATABASE_HIKARI_MAX_POOL_SIZE:3}

spring:
    application:
        name: openvesselphotos
    jmx:
        enabled: false
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC
                dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
        locations: classpath:/db/migration
    servlet:
        multipart:
            max-file-size: 15MB
            max-request-size: 16MB
