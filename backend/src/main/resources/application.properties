spring.application.name=openvesselphotos
server.port=${PORT:8880}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# The datasource is built from DATABASE_URL (Scalingo format), see DatabaseConfig.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Unique admin password. Empty = admin disabled.
openvesselphotos.admin-password=${ADMIN_PASSWORD:}

# Scalingo exposes SCALINGO_POSTGRESQL_URL (and DATABASE_URL); postgres:// and jdbc: URLs are both accepted.
openvesselphotos.database-url=${SCALINGO_POSTGRESQL_URL:${DATABASE_URL:postgres://ovp:ovp@localhost:5432/ovp}}
openvesselphotos.database-pool-size=${DB_POOL_SIZE:5}
